[package]
name = "ai2"
version = "0.1.0"
edition = "2024"

[features]
default = ["hash-buckets"]
# Store training buckets as HashMap<u32, u32> instead of Vec<(u32, u32)>.
# Measured on 10 books: ~37% more peak RAM, ~38% faster training.
hash-buckets = []

[dependencies]
rand = "0.10.3"
hashbrown = { version = "0.17.1", features = ["serde"] }  # keep your current version, just add the feature
bincode = { version = "2", features = ["serde"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
rustc-hash = "2.1.3"
memmap2 = "0.9.12"
memchr = "2.8.3"
