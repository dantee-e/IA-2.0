[package]
name = "ai2"
version = "0.1.0"
edition = "2024"

[features]
# Default is the Vec bucket storage: ~4-5 GB less peak RAM on the full model
# (hashbrown allocates >=144 B per non-empty map), which matters on 19 GB boxes.
# Enable `hash-buckets` for ~35% faster training if memory allows.
# Note: checkpoint bucket encoding depends on this feature — build `convert`
# with the same feature the checkpoint was written with.
default = []
hash-buckets = []

[dependencies]
rand = "0.10.3"
hashbrown = { version = "0.17.1", features = ["serde"] }  # keep your current version, just add the feature
bincode = { version = "2", features = ["serde"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
rustc-hash = "2.1.3"
memmap2 = "0.9.12"
memchr = "2.8.3"
rayon = "1.12.0"
